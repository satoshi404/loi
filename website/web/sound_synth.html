<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loi + raylib na web</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      padding: 12px;
      background: #0a0e14;
      color: #e8ecf8;
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    #status { margin-bottom: 8px; color: #98a2b8; }
    #stage { position: relative; display: inline-block; max-width: 100%; }
    #hint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(10, 14, 20, 0.78);
      color: #e8ecf8;
      text-align: center;
      cursor: pointer;
    }
    #canvas {
      display: block;
      max-width: 100%;
      border: 1px solid #2a3040;
      background: #000;
    }
    #output {
      display: none;
      max-height: 96px;
      overflow: auto;
      margin: 8px 0 0;
      color: #98a2b8;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="status">Carregando...</div>
  <div id="stage">
    <canvas id="canvas" tabindex="0"></canvas>
    <div id="hint">Clique ou toque para liberar o audio</div>
  </div>
  <pre id="output"></pre>
  <script src="sound_synth.loader.js"></script>
  <script async src="sound_synth.js"></script>
</body>
</html>
